<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="wmGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FF2A3A" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2A3A"/>
      <stop offset="25%" stop-color="#FF2A3A"/>
      <stop offset="25.1%" stop-color="#222222"/>
      <stop offset="100%" stop-color="#222222"/>
    </linearGradient>
  </defs>

  <!-- Squircle Launcher Base -->
  <rect width="512" height="512" rx="112" fill="#080808" stroke="#202020" stroke-width="6"/>
  <rect width="512" height="512" rx="112" fill="url(#wmGlow)"/>

  <!-- Logo Mark: 02 Wordmark / Monolithic Logotype -->
  <g transform="translate(256, 256)">
    <!-- Subtitle / OS Indicator -->
    <text x="0" y="-72" text-anchor="middle" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="8" fill="#777777">SYSTEM IDENTITY</text>

    <!-- NØTUNE Typography Glyphs Centered -->
    <g transform="translate(-160, 20)">
      <!-- N -->
      <text x="0" y="0" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="52" font-weight="800" letter-spacing="8" fill="#FFFFFF">N</text>
      <!-- Ø glyph with crimson diagonal slash -->
      <text x="56" y="0" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="52" font-weight="800" letter-spacing="8" fill="#FFFFFF">O</text>
      <line x1="62" y1="8" x2="100" y2="-48" stroke="#FF2A3A" stroke-width="7" stroke-linecap="round"/>
      <!-- TUNE -->
      <text x="112" y="0" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="52" font-weight="800" letter-spacing="8" fill="#FFFFFF">TUNE</text>
    </g>

    <!-- Calibrated Architecture Rule Bar -->
    <rect x="-160" y="44" width="320" height="4" rx="2" fill="url(#barGrad)"/>

    <!-- Bottom Technical Specs -->
    <text x="-160" y="76" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#555555">VER 1.0</text>
    <text x="160" y="76" text-anchor="end" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#FF2A3A">EDITORIAL OS</text>
  </g>
</svg>
