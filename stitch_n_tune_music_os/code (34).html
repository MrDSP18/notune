<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="tokyoGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FF007A" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#00F0FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#070712" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle Launcher Base -->
  <rect width="512" height="512" rx="112" fill="#06060F" stroke="#221430" stroke-width="6"/>
  <rect width="512" height="512" rx="112" fill="url(#tokyoGlow)"/>

  <!-- Logo Mark: Neon Ring -->
  <g transform="translate(256, 256)">
    <!-- Outer Neon Pink Ring -->
    <circle r="150" fill="none" stroke="#FF007A" stroke-width="14" opacity="0.95"/>
    <!-- Middle Cyan Segmented Ring -->
    <circle r="110" fill="none" stroke="#00F0FF" stroke-width="13" stroke-dasharray="165 35"/>
    <!-- Inner White Core Ring -->
    <circle r="65" fill="none" stroke="#FFFFFF" stroke-width="10"/>
    <!-- Center Audio Emitter -->
    <circle r="24" fill="#FF007A"/>
    <circle r="9" fill="#00F0FF"/>

    <!-- Crosshair Reticle Markers -->
    <line x1="0" y1="-180" x2="0" y2="-152" stroke="#00F0FF" stroke-width="8" stroke-linecap="round"/>
    <line x1="0" y1="152" x2="0" y2="180" stroke="#00F0FF" stroke-width="8" stroke-linecap="round"/>
    <line x1="-180" y1="0" x2="-152" y2="0" stroke="#FF007A" stroke-width="8" stroke-linecap="round"/>
    <line x1="152" y1="0" x2="180" y2="0" stroke="#FF007A" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
