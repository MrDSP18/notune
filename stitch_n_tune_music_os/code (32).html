<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="cubeGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FF2A3A" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle Launcher Base -->
  <rect width="512" height="512" rx="112" fill="#080808" stroke="#202020" stroke-width="6"/>
  <rect width="512" height="512" rx="112" fill="url(#cubeGlow)"/>

  <!-- Logo Mark: Hyper Cube -->
  <g transform="translate(256, 256)">
    <!-- Outer Isometric Hexagonal Projection -->
    <polygon points="0,-140 122,-70 122,70 0,140 -122,70 -122,-70" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round"/>
    <!-- Inner Scaled Projection in Accent Red -->
    <polygon points="0,-70 61,-35 61,35 0,70 -61,35 -61,-35" fill="none" stroke="#FF2A3A" stroke-width="11" stroke-linejoin="round"/>
    
    <!-- Isometric Dimension Bus Connectors -->
    <line x1="0" y1="-140" x2="0" y2="-70" stroke="#FF2A3A" stroke-width="10" stroke-linecap="round"/>
    <line x1="122" y1="-70" x2="61" y2="-35" stroke="#FF2A3A" stroke-width="10" stroke-linecap="round"/>
    <line x1="122" y1="70" x2="61" y2="35" stroke="#FF2A3A" stroke-width="10" stroke-linecap="round"/>
    <line x1="0" y1="140" x2="0" y2="70" stroke="#FF2A3A" stroke-width="10" stroke-linecap="round"/>
    <line x1="-122" y1="70" x2="-61" y2="35" stroke="#FF2A3A" stroke-width="10" stroke-linecap="round"/>
    <line x1="-122" y1="-70" x2="-61" y2="-35" stroke="#FF2A3A" stroke-width="10" stroke-linecap="round"/>

    <!-- Central Spatial Anchor -->
    <circle cx="0" cy="0" r="14" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="6" fill="#FF2A3A"/>
  </g>
</svg>
