<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="gridGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FF2A3A" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle Launcher Base -->
  <rect width="512" height="512" rx="112" fill="#080808" stroke="#202020" stroke-width="6"/>
  <rect width="512" height="512" rx="112" fill="url(#gridGlow)"/>

  <!-- Logo Mark: 09 Technical Grid (Calibration Reticle & Debug Matrix) -->
  <g transform="translate(256, 256)">
    <!-- Subdivided Technical Grid Matrix -->
    <rect x="-130" y="-130" width="260" height="260" fill="none" stroke="#262626" stroke-width="3"/>
    
    <!-- Coordinate Subdivisions -->
    <line x1="-130" y1="0" x2="130" y2="0" stroke="#333333" stroke-width="2.5" stroke-dasharray="8 6"/>
    <line x1="0" y1="-130" x2="0" y2="130" stroke="#333333" stroke-width="2.5" stroke-dasharray="8 6"/>
    <line x1="-65" y1="-130" x2="-65" y2="130" stroke="#1C1C1C" stroke-width="1.5"/>
    <line x1="65" y1="-130" x2="65" y2="130" stroke="#1C1C1C" stroke-width="1.5"/>
    <line x1="-130" y1="-65" x2="130" y2="-65" stroke="#1C1C1C" stroke-width="1.5"/>
    <line x1="-130" y1="65" x2="130" y2="65" stroke="#1C1C1C" stroke-width="1.5"/>

    <!-- Heavy Framing Corner Targeting Brackets -->
    <path d="M -130 -80 L -130 -130 L -80 -130" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="square"/>
    <path d="M 80 -130 L 130 -130 L 130 -80" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="square"/>
    <path d="M 130 80 L 130 130 L 80 130" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="square"/>
    <path d="M -80 130 L -130 130 L -130 80" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="square"/>

    <!-- Central Precision Reticle -->
    <circle cx="0" cy="0" r="46" fill="none" stroke="#FF2A3A" stroke-width="8"/>
    <circle cx="0" cy="0" r="16" fill="#FF2A3A"/>
    <circle cx="0" cy="0" r="6" fill="#FFFFFF"/>

    <!-- Reticle Crosshair Ticks -->
    <line x1="-62" y1="0" x2="-46" y2="0" stroke="#FF2A3A" stroke-width="5" stroke-linecap="round"/>
    <line x1="46" y1="0" x2="62" y2="0" stroke="#FF2A3A" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="-62" x2="0" y2="-46" stroke="#FF2A3A" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="46" x2="0" y2="62" stroke="#FF2A3A" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
