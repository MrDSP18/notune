<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="pulseGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FF2A3A" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pulseLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="35%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#FF2A3A"/>
      <stop offset="65%" stop-color="#FF2A3A"/>
      <stop offset="75%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Squircle Launcher Base -->
  <rect width="512" height="512" rx="112" fill="#080808" stroke="#202020" stroke-width="6"/>
  <rect width="512" height="512" rx="112" fill="url(#pulseGlow)"/>

  <!-- Logo Mark: 08 Pulse (Biometric ECG Rhythm / Biolink) -->
  <g transform="translate(256, 256)">
    <!-- Perimeter Calibrated Ring -->
    <circle r="150" fill="none" stroke="#202020" stroke-width="4"/>
    <circle r="150" fill="none" stroke="#FF2A3A" stroke-width="4" stroke-dasharray="50 200" stroke-linecap="round"/>
    <circle r="120" fill="none" stroke="#161616" stroke-width="2"/>

    <!-- Pulse ECG Polyline Trace -->
    <polyline points="-140,0 -70,0 -48,-84 -18,102 14,-52 42,36 68,0 140,0" fill="none" stroke="url(#pulseLine)" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Critical Biometric Peak Nodes -->
    <circle cx="-48" cy="-84" r="11" fill="#FFFFFF"/>
    <circle cx="-18" cy="102" r="13" fill="#FF2A3A"/>
    <circle cx="14" cy="-52" r="10" fill="#FFFFFF"/>
    <circle cx="42" cy="36" r="9" fill="#FF2A3A"/>

    <!-- Pulse Target Baseline Indicators -->
    <circle cx="-140" cy="0" r="6" fill="#666666"/>
    <circle cx="140" cy="0" r="6" fill="#666666"/>

    <!-- BPM Telemetry Badge -->
    <g transform="translate(0, 96)">
      <rect x="-44" y="0" width="88" height="24" rx="6" fill="#14080A" stroke="#FF2A3A" stroke-width="1.2"/>
      <text x="0" y="16" text-anchor="middle" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#FF2A3A">128 BPM</text>
    </g>
  </g>
</svg>
