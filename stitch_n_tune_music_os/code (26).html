<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="spectrumGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FF2A3A" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barCrimson" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF2A3A"/>
      <stop offset="100%" stop-color="#FF5260"/>
    </linearGradient>
  </defs>

  <!-- Squircle Launcher Base -->
  <rect width="512" height="512" rx="112" fill="#080808" stroke="#202020" stroke-width="6"/>
  <rect width="512" height="512" rx="112" fill="url(#spectrumGlow)"/>

  <!-- Logo Mark: 07 Spectrum (Equalizer Peak Matrix) -->
  <g transform="translate(256, 256)">
    <!-- Equalizer Ceiling Calibration Threshold Line -->
    <line x1="-150" y1="-124" x2="150" y2="-124" stroke="#FF2A3A" stroke-width="4" stroke-dasharray="8 8" opacity="0.85"/>
    <text x="150" y="-136" text-anchor="end" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#FF2A3A">PEAK 0dB</text>

    <!-- Spectrum Bars Group -->
    <!-- Bar 1: White 60Hz -->
    <rect x="-140" y="-30" width="28" height="130" rx="14" fill="#FFFFFF"/>
    <!-- Bar 2: White 250Hz -->
    <rect x="-92" y="-76" width="28" height="176" rx="14" fill="#FFFFFF"/>
    <!-- Bar 3: Crimson Peak 1kHz -->
    <rect x="-44" y="-116" width="28" height="216" rx="14" fill="url(#barCrimson)"/>
    <!-- Bar 4: Crimson Peak 2.5kHz -->
    <rect x="4" y="-96" width="28" height="196" rx="14" fill="url(#barCrimson)"/>
    <!-- Bar 5: White 8kHz -->
    <rect x="52" y="-118" width="28" height="218" rx="14" fill="#FFFFFF"/>
    <!-- Bar 6: White 16kHz -->
    <rect x="100" y="-46" width="28" height="146" rx="14" fill="#FFFFFF"/>

    <!-- Peak Capture Nodes -->
    <circle cx="-30" cy="-124" r="5" fill="#FF2A3A"/>
    <circle cx="66" cy="-124" r="5" fill="#FFFFFF"/>
    
    <!-- Floor Rule -->
    <line x1="-150" y1="116" x2="150" y2="116" stroke="#222222" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
