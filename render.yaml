# Render Infrastructure as Code Blueprint for NØTUNE Cloud Ecosystem
# Automatically provisions free Node.js backend web service and PostgreSQL database.

services:
  - type: web
    name: notune-backend-service
    env: node
    rootDir: notune-backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 8080
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: notune-postgres-db
          property: connectionString

databases:
  - name: notune-postgres-db
    databaseName: notune_db
    user: notune_user
    plan: free
