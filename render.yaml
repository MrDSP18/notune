# Render Blueprint for NØTUNE backend. All credentials must be configured as
# Render secret environment variables; never place secrets in this file.
services:
  - type: web
    name: notune-backend-service
    env: node
    rootDir: notune-backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: notune-postgres-db
          property: connectionString

databases:
  - name: notune-postgres-db
    databaseName: notune_db
    user: notune_user
    plan: free
