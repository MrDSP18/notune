name: Release Direct APK Build

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - feature/notune-platform-rebuild
  workflow_dispatch:

env:
  JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
  GRADLE_OPTS: "-Djava.awt.headless=true -Dorg.gradle.daemon=false"

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish Direct APK Asset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Universal FOSS Debug APK
        run: ./gradlew :app:assembleUniversalFossDebug -Djava.awt.headless=true --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOTUNE-v2.0-Universal
          path: app/build/outputs/apk/universalFoss/debug/app-universal-foss-debug.apk

      - name: Create GitHub Release & Attach Direct APK Asset (Public Download)
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: NØTUNE Universal Latest Release
          body: |
            ### 📱 Public Direct APK Download (No GitHub Login Required)
            Download the latest NØTUNE Universal APK directly below without logging into GitHub.
          draft: false
          prerelease: false
          files: app/build/outputs/apk/universalFoss/debug/app-universal-foss-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

