name: Release Production APK Build & Verification

on:
  push:
    tags:
      - 'v*'
    branches:
      - release/notune-final
      - develop/notune-v3.2
  workflow_dispatch:

env:
  JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
  GRADLE_OPTS: "-Djava.awt.headless=true -Dorg.gradle.daemon=false"

permissions:
  contents: write

jobs:
  verify-and-release:
    name: Verify, Build & Publish Signed Production Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Decode Production Keystore
        if: ${{ secrets.NOTUNE_RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.NOTUNE_RELEASE_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          echo "NOTUNE_RELEASE_KEYSTORE_PATH=$GITHUB_WORKSPACE/keystore.jks" >> $GITHUB_ENV

      - name: Run Unit Tests
        run: ./gradlew testUniversalFossDebugUnitTest --no-daemon

      - name: Build Universal FOSS Release APK
        env:
          NOTUNE_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.NOTUNE_RELEASE_KEYSTORE_PASSWORD }}
          NOTUNE_RELEASE_KEY_ALIAS: ${{ secrets.NOTUNE_RELEASE_KEY_ALIAS }}
          NOTUNE_RELEASE_KEY_PASSWORD: ${{ secrets.NOTUNE_RELEASE_KEY_PASSWORD }}
          REQUIRE_PRODUCTION_SIGNING: ${{ secrets.NOTUNE_RELEASE_KEYSTORE_BASE64 != '' && 'true' || 'false' }}
        run: ./gradlew assembleUniversalFossRelease --no-daemon

      - name: Verify APK Signature & Compute Release SHA-256
        run: |
          APK_PATH="app/build/outputs/apk/universalFoss/release/app-universal-foss-release.apk"
          SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
          echo "APK_SHA256=$SHA256" >> $GITHUB_ENV
          echo "Release APK SHA-256: $SHA256"

          # Verify APK signature using apksigner
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          $BUILD_TOOLS_DIR/apksigner verify --verbose "$APK_PATH"

          # Extract public certificate fingerprint if keystore exists
          if [ -f keystore.jks ]; then
            FINGERPRINT=$(keytool -list -v -keystore keystore.jks -alias "${{ secrets.NOTUNE_RELEASE_KEY_ALIAS }}" -storepass "${{ secrets.NOTUNE_RELEASE_KEYSTORE_PASSWORD }}" | grep "SHA256:" | head -n 1 | awk '{print $2}')
            echo "CERT_FINGERPRINT=$FINGERPRINT" >> $GITHUB_ENV
            echo "Certificate SHA-256 Fingerprint: $FINGERPRINT"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-universal-foss-release.apk
          path: app/build/outputs/apk/universalFoss/release/app-universal-foss-release.apk

      - name: Create GitHub Release & Attach Artifact
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: NØTUNE ${{ github.ref_name }} Release
          body: |
            ### 📱 Official NØTUNE Production Release (${{ github.ref_name }})
            - **Release Artifact**: `app-universal-foss-release.apk`
            - **SHA-256 Checksum**: `${{ env.APK_SHA256 }}`
          draft: false
          prerelease: false
          files: app/build/outputs/apk/universalFoss/release/app-universal-foss-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
