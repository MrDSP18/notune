name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

env:
  JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
  GRADLE_OPTS: "-Djava.awt.headless=true -Dorg.gradle.daemon=false"

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify Git History
        run: |
          git status
          git rev-parse HEAD
          git log --oneline -5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Lint
        run: |
          ./gradlew lintUniversalFossDebug -Djava.awt.headless=true --no-daemon

      - name: Run Core & Playback Unit Tests
        run: |
          ./gradlew :core:testDebugUnitTest :playback:testFossDebugUnitTest -Djava.awt.headless=true --no-daemon

      - name: Run App Unit Tests
        run: |
          ./gradlew :app:testUniversalFossDebugUnitTest -Djava.awt.headless=true --no-daemon

      - name: Upload Lint Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: "**/build/reports/lint-results-*.html"
          if-no-files-found: ignore

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/build/reports/tests/"
          if-no-files-found: ignore

      - name: Build Universal FOSS Debug APK & AAB
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -validity 10000
          ./gradlew assembleUniversalFossDebug bundleUniversalFossDebug -Djava.awt.headless=true --no-daemon

      - name: Upload Universal Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NOTUNE-Universal-FOSS-Debug-APK
          path: app/build/outputs/apk/universalFoss/debug/app-universal-foss-debug.apk

      - name: Upload Universal Debug AAB
        uses: actions/upload-artifact@v4
        with:
          name: NOTUNE-Universal-FOSS-Debug-AAB
          path: app/build/outputs/bundle/universalFossDebug/app-universal-foss-debug.aab
          if-no-files-found: ignore

  publish-preview:
    name: Publish Public Direct APK Release
    runs-on: ubuntu-latest
    needs: build-and-test
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Download Built APK
        uses: actions/download-artifact@v4
        with:
          name: NOTUNE-Universal-FOSS-Debug-APK
          path: artifacts/

      - name: Publish Public Direct APK Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: "latest"
          target_commitish: ${{ github.sha }}
          name: "NØTUNE Universal Direct Release"
          body: |
            ### 📱 Public Direct APK Download (No GitHub Login Required)
            Automated direct APK build from commit `${{ github.sha }}` on branch `${{ github.ref_name }}`.
            
            > [!NOTE]
            > This is a continuous integration build for direct testing and verification.
            > For signed production releases, download the official release tags.
          draft: false
          prerelease: false
          files: artifacts/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
