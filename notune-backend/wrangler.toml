# Cloudflare Worker Configuration for NØTUNE Global Edge Server
name = "notune-api"
main = "worker.js"
compatibility_date = "2026-10-04"
account_id = "${CLOUDFLARE_ACCOUNT_ID}"

[[d1_databases]]
binding = "DB"
database_name = "notune-db"
database_id = "${CLOUDFLARE_D1_DATABASE_ID}"

[vars]
ENVIRONMENT = "production"
JWT_SECRET = "${JWT_SECRET}"
R2_ENDPOINT = "${CLOUDFLARE_R2_ENDPOINT}"
R2_ACCESS_KEY_ID = "${CLOUDFLARE_R2_ACCESS_KEY_ID}"
R2_SECRET_ACCESS_KEY = "${CLOUDFLARE_R2_SECRET_ACCESS_KEY}"
