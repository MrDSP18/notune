version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: notune_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: notune_secure_password
      POSTGRES_DB: notunedb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:
    build: .
    container_name: notune_backend_server
    restart: always
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://postgres:notune_secure_password@postgres:5432/notunedb
      JWT_SECRET: notune_docker_jwt_production_secret_2026
    depends_on:
      - postgres

volumes:
  postgres_data:
