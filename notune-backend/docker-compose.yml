version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: notune_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: notune_secure_password
      POSTGRES_DB: notunedb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  postgres_data:
